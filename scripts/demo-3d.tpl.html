<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>neurograph 3D: a particle brain in raw WebGL</title>
<style>
  :root{ --panel:rgba(255,255,255,.05); --stroke:rgba(255,255,255,.12); --txt:#e6ecff; --muted:#8b96b8; --accent:#22d3ee; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#02050b;color:var(--txt);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  .hud{position:fixed;left:20px;top:20px;z-index:5;width:280px;background:var(--panel);
    border:1px solid var(--stroke);border-radius:16px;padding:16px 16px 12px;backdrop-filter:blur(14px)}
  .hud h1{margin:0 0 2px;font-size:15px}
  .hud p{margin:0 0 12px;color:var(--muted);font-size:12px}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row label{width:84px;color:var(--muted);font-size:12px}
  .row input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
  .row output{width:38px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
  .row input[type=checkbox]{accent-color:var(--accent)}
  .btn{width:100%;margin-top:8px;cursor:pointer;padding:7px 8px;border-radius:9px;font-size:12px;
    background:rgba(255,255,255,.04);border:1px solid var(--stroke);color:var(--txt);transition:.15s}
  .btn:hover{background:rgba(255,255,255,.1)}
  .swatches{display:flex;gap:8px;margin-top:10px}
  .swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .swatches button[data-on="1"]{border-color:#fff}
  .hint{margin-top:10px;font-size:11px;color:var(--muted)}
  .hint a{color:var(--accent);text-decoration:none}
  .brand{position:fixed;right:24px;bottom:18px;z-index:5;color:var(--muted);font-size:11px}
  .msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px}
  @media (max-width:600px){ .hud{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:44vh;overflow:auto} .brand{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="msg" id="msg">WebGL is not available here. <a href="index.html" style="color:#22d3ee">Open the 2D version</a>.</div>

<div class="hud">
  <h1>neurograph 3D</h1>
  <p>The same anatomy as a WebGL particle cloud. Drag to rotate, click to fire a wave.</p>

  <div class="row"><label>Density</label><input id="density" type="range" min="20" max="140" value="100"><output id="densityv">1.00</output></div>
  <div class="row"><label>Pulses</label><input id="pulses" type="range" min="0" max="240" value="120"><output id="pulsesv">120</output></div>
  <div class="row"><label>Glow</label><input id="glow" type="range" min="0" max="100" value="100"><output id="glowv">1.00</output></div>
  <div class="row"><label>Links</label><input id="links" type="checkbox" checked></div>
  <div class="row"><label>Auto rotate</label><input id="rot" type="checkbox" checked></div>

  <div class="swatches" id="swatches">
    <button data-a="#66EBF7" data-b="#AD99FF" style="background:linear-gradient(135deg,#66EBF7,#AD99FF)" data-on="1"></button>
    <button data-a="#34d399" data-b="#0ea5e9" style="background:linear-gradient(135deg,#34d399,#0ea5e9)"></button>
    <button data-a="#f472b6" data-b="#f59e0b" style="background:linear-gradient(135deg,#f472b6,#f59e0b)"></button>
    <button data-a="#ffffff" data-b="#93c5fd" style="background:linear-gradient(135deg,#fff,#93c5fd)"></button>
  </div>

  <button class="btn" id="fire">Fire wave</button>
  <div class="hint" id="stats"></div>
  <div class="hint"><a href="index.html">&larr; Back to the 2D demo</a></div>
</div>
<div class="brand">silhouette: public domain, via Wikimedia Commons · github.com/leonardocandiani/neurograph</div>

<script>
(() => {
/*__MODULE__*/

const $ = (id) => document.getElementById(id);
let brain;
try {
  brain = createNeurograph3D($("c"), {});
} catch (err) {
  $("msg").style.display = "flex";
  $("c").style.display = "none";
  document.querySelector(".hud").style.display = "none";
  return;
}
const stats = () => { $("stats").textContent = brain.nodeCount + " points · " + brain.linkCount + " links"; };
stats();

const bind = (id, fmt, apply) => {
  const el = $(id), out = $(id + "v");
  el.addEventListener("input", () => { out.textContent = fmt(+el.value); apply(+el.value); stats(); });
};
bind("density", (v) => (v / 100).toFixed(2), (v) => brain.update({ density: v / 100 }));
bind("pulses", (v) => String(v), (v) => brain.update({ pulses: v }));
bind("glow", (v) => (v / 100).toFixed(2), (v) => brain.update({ glow: v / 100 }));
$("links").addEventListener("change", (e) => { brain.update({ links: e.target.checked }); stats(); });
$("rot").addEventListener("change", (e) => brain.update({ autoRotate: e.target.checked }));
$("fire").addEventListener("click", () => brain.wave());
$("swatches").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  document.querySelectorAll("#swatches button").forEach((x) => x.removeAttribute("data-on"));
  b.setAttribute("data-on", "1");
  brain.update({ colorA: b.dataset.a, colorB: b.dataset.b });
});
window.brain = brain;
})();
</script>
</body>
</html>
